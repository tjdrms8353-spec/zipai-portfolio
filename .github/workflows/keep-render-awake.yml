name: Keep Render Awake

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render health endpoint
        run: >-
          curl
          --fail
          --silent
          --show-error
          --max-time 90
          --retry 2
          --retry-delay 10
          https://zibai-portfolio.onrender.com/health
